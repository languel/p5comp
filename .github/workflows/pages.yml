name: Test and publish p5comp
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
        env:
          PAGES_BASE: /p5comp/
      - name: Verify actual browser compiler toolchain
        run: |
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 > /tmp/p5comp-compiler-http.log 2>&1 &
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail --silent --show-error http://127.0.0.1:4173/compiler/avr/manifest.json > /dev/null
          COMPILER_ASSET_URL=http://127.0.0.1:4173/compiler/avr/ npm run verify:browser-compiler
      - run: npm run verify:compiler-assets
      - run: npm run verify:examples
      - run: npm run verify:drawing
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
